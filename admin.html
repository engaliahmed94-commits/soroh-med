<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة إدارة صروح ميد</title>
<meta name="theme-color" content="#0a2d4d">
<style>
:root{--bg:#eef3f7;--panel:#fff;--ink:#0a2d4d;--mute:#5b7186;--line:#d8e3ec;--brand:#117a9c;--ok:#0f9f6e;--no:#c8423b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#07182a;--panel:#0d2640;--ink:#e6f1f8;--mute:#8fb0c6;--line:#1d3b57;--brand:#4cc3e6;--ok:#3ddc97;--no:#ff7a70;--warn:#f5c15a}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;padding:0 0 70px}
header{background:var(--ink);color:var(--bg);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:10px;font-weight:700;font-size:14px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.no{color:var(--no);border-color:var(--no)}.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
#gate{max-width:360px;margin:60px auto;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
#gate h2{margin-bottom:10px}#gate p{color:var(--mute);margin-bottom:12px;line-height:1.7}
input{width:100%;padding:11px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#app{display:none;max-width:980px;margin:0 auto;padding:14px}
#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
#tabs button{white-space:nowrap}
#tabs button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.n{background:#ffd166;color:#06223a;border-radius:20px;padding:0 8px;margin-inline-start:6px;font-size:12px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.t{font-weight:700;font-size:16px}.d{color:var(--mute);font-size:13px;margin-top:3px}
.st{font-size:12px;padding:2px 9px;border-radius:20px;margin-inline-start:8px;background:var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.docs a{display:inline-block;margin:6px 8px 0 0;color:var(--brand)}
.empty{padding:30px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px;margin-top:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><b>لوحة إدارة صروح ميد</b><span style="display:flex;gap:6px"><button class="btn" id="ref" style="display:none">تحديث</button><button class="btn" id="out" style="display:none">خروج</button></span></header>

<div id="gate"><h2 id="gt">دخول المدير</h2><p id="gm"></p>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
<input id="pw" type="password" placeholder="الرمز السري" autocomplete="current-password" dir="ltr">
<button class="btn pri" id="retry" type="button" style="width:100%">دخول</button></div>

<div id="app">
 <div id="tabs"></div>
 <h2 id="title" style="margin-top:8px"></h2>
 <div id="list"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL="https://udaqibcledtryjgfzxfc.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkYXFpYmNsZWR0cnlqZ2Z6eGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNzkxMDYsImV4cCI6MjEwODg1NTEwNn0.hsQ7wDCO1-zHc_sgQh-WREiWGv481VEfLw1TgV5wQpI";
var sb=null;
function $(i){return document.getElementById(i)}
function errText(e){
 var m=(e&&e.message)||"";
 if(/Invalid login/i.test(m))return "الإيميل أو الرمز غير صحيح.";
 if(/Failed to fetch|NetworkError/i.test(m))return "تعذر الاتصال بالإنترنت أو بقاعدة البيانات.";
 if(/row-level security|permission/i.test(m))return "ما عندك صلاحية لهذه العملية.";
 return "خطأ: "+(m||"غير معروف");
}
function toast(m){var e=$("toast");e.textContent=m;e.className="on";setTimeout(function(){e.className=""},1800)}

/* كل قسم: الجدول، العنوان، الوصف، حقل الحالة، والأزرار */
var S=[
 {k:"companies",f:[["name","اسم الشركة"],["phone","الهاتف"],["city","المدينة"],["email","الإيميل"],["whatsapp","واتساب"],["address","العنوان"],["description","وصف"]],def:{verification_status:"verified"},l:"الشركات",title:function(r){return r.name},desc:function(r){return [r.city,r.phone,r.email,r.address].filter(Boolean).join(" · ")},
  st:function(r){return {pending:"بانتظار المراجعة",verified:"موثقة",rejected:"مرفوضة"}[r.verification_status]},pend:function(r){return r.verification_status==="pending"},
  acts:[["توثيق","ok",{verification_status:"verified"}],["رفض","no",{verification_status:"rejected"}]],docs:true},
 {k:"devices",f:[["name","اسم الجهاز"],["category","الفئة"],["price","السعر","n"],["contact_phone","هاتف التواصل"],["description","وصف"],["section","رمز القسم (مثل device أو lab أو sup)"]],def:{is_approved:true,section:"device"},l:"الأجهزة والمستلزمات",title:function(r){return r.name},desc:function(r){return [{device:"جهاز",lab_supply:"مستلزمات مختبر",medical_supply:"مستلزمات طبية"}[r.section]||r.section,r.price?r.price+" $":"",r.contact_phone].filter(Boolean).join(" · ")},
  st:function(r){return r.is_approved?"ظاهر":"بانتظار الموافقة"},pend:function(r){return !r.is_approved},
  acts:[["قبول","ok",{is_approved:true}],["إخفاء","no",{is_approved:false}]]},
 {k:"maintenance_requests",l:"طلبات الصيانة",title:function(r){return r.device_name+" — "+r.requester_name},desc:function(r){return [r.problem,r.city,r.phone].filter(Boolean).join(" · ")},
  st:function(r){return {"new":"جديد",in_progress:"قيد المعالجة",done:"منجز"}[r.status]},pend:function(r){return r.status==="new"},
  acts:[["قيد المعالجة","pri",{status:"in_progress"}],["منجز","ok",{status:"done"}]]},
 {k:"maintenance_offers",f:[["provider_name","اسم المزود"],["phone","الهاتف"],["service_type","نوع الخدمة"],["area","المنطقة"],["pricing","السعر"],["devices_covered","الأجهزة"]],def:{is_approved:true},l:"عروض الصيانة",title:function(r){return r.provider_name},desc:function(r){return [r.service_type,r.area,r.pricing,r.phone].filter(Boolean).join(" · ")},
  st:function(r){return r.is_approved?"ظاهر":"بانتظار الموافقة"},pend:function(r){return !r.is_approved},
  acts:[["قبول","ok",{is_approved:true}],["إخفاء","no",{is_approved:false}]]},
 {k:"device_requests",l:"طلبات أجهزة",title:function(r){return r.requester_name},desc:function(r){return [r.description,"الكمية: "+r.quantity,r.phone].join(" · ")},
  st:function(r){return {"new":"جديد",answered:"تم الرد",closed:"مغلق"}[r.status]},pend:function(r){return r.status==="new"},
  acts:[["تم الرد","ok",{status:"answered"}],["إغلاق","no",{status:"closed"}]]},
 {k:"admin_log",l:"سجل العمليات",title:function(r){return r.action+" — "+(r.entity_name||"")},desc:function(r){return new Date(r.created_at).toLocaleString("ar-IQ")},st:function(){return ""},pend:function(){return false},acts:[],ro:true}
];
var cur=0,cache={};

function openForm(s,r){
 var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px";
 var bx=document.createElement("div");bx.style.cssText="background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto";
 var h=document.createElement("h3");h.style.marginBottom="10px";h.textContent=(r?"تعديل: ":"إضافة: ")+s.l;bx.appendChild(h);
 var ins=[];
 s.f.forEach(function(f){var l=document.createElement("label");l.style.cssText="font-size:13px;color:var(--mute)";l.textContent=f[1];var i=document.createElement("input");i.value=r&&r[f[0]]!=null?r[f[0]]:"";bx.appendChild(l);bx.appendChild(i);ins.push(i)});
 var row=document.createElement("div");row.className="acts";
 var sv=document.createElement("button");sv.type="button";sv.className="btn pri";sv.textContent="حفظ";
 var cn=document.createElement("button");cn.type="button";cn.className="btn";cn.textContent="إلغاء";cn.onclick=function(){ov.remove()};
 sv.onclick=async function(){
  var o={};s.f.forEach(function(f,k){var v=ins[k].value.trim();if(f[2]==="n")o[f[0]]=v===""?null:Number(v);else o[f[0]]=v===""?null:v});
  if(!o[s.f[0][0]]){toast("الحقل الأول مطلوب");return}
  try{if(r)await upd(s.k,r.id,o);else await ins(s.k,Object.assign({},s.def,o))}catch(e){toast(errText(e));return}
  await log(r?"تعديل":"إضافة",s.k,o[s.f[0][0]]);ov.remove();toast("تم الحفظ");load();
 };
 row.appendChild(sv);row.appendChild(cn);bx.appendChild(row);ov.appendChild(bx);document.body.appendChild(ov);
}

async function load(){
 for(var i=0;i<S.length;i++){
  var r=await sb.from(S[i].k).select("*").order("created_at",{ascending:false}).limit(200);
  if(r.error)throw r.error;
  cache[S[i].k]=r.data||[];
 }
 render();
}
async function log(action,entity,name){try{await sb.from("admin_log").insert({action:action,entity:entity,entity_name:name})}catch(e){}}
async function upd(table,id,o){var r=await sb.from(table).update(o).eq("id",id);if(r.error)throw r.error}
async function ins(table,o){var r=await sb.from(table).insert(o);if(r.error)throw r.error}
function render(){
 var tabs=$("tabs");tabs.innerHTML="";
 S.forEach(function(s,i){
  var b=document.createElement("button");b.className="btn";b.type="button";
  if(i===cur)b.setAttribute("aria-current","true");
  var n=(cache[s.k]||[]).filter(s.pend).length;
  b.textContent=s.l;
  if(n){var sp=document.createElement("span");sp.className="n";sp.textContent=n;b.appendChild(sp)}
  b.onclick=function(){cur=i;render()};tabs.appendChild(b);
 });
 var s=S[cur],rows=cache[s.k]||[];
 $("title").textContent=s.l+" ("+rows.length+")";
 if(s.f){var ab=document.createElement("button");ab.type="button";ab.className="btn pri";ab.style.marginInlineStart="10px";ab.textContent="+ إضافة";ab.onclick=function(){openForm(s,null)};$("title").appendChild(ab)}
 var list=$("list");list.innerHTML="";
 if(!rows.length){var e=document.createElement("div");e.className="empty";e.textContent="لا توجد بيانات بعد";list.appendChild(e);return}
 rows.forEach(function(r){
  var row=document.createElement("div");row.className="row";
  var info=document.createElement("div");
  var t=document.createElement("div");t.className="t";t.textContent=s.title(r);
  var st=s.st(r);if(st){var sp=document.createElement("span");sp.className="st";sp.textContent=st;t.appendChild(sp)}
  var d=document.createElement("div");d.className="d";d.textContent=s.desc(r);
  info.appendChild(t);info.appendChild(d);
  var dz=document.createElement("div");dz.className="docs";info.appendChild(dz);
  row.appendChild(info);
  if(!s.ro){
   var a=document.createElement("div");a.className="acts";
   s.acts.forEach(function(x){
    var b=document.createElement("button");b.type="button";b.className="btn "+x[1];b.textContent=x[0];
    b.onclick=async function(){
     try{await upd(s.k,r.id,x[2])}catch(e){toast(errText(e));return}
     await log(x[0],s.k,s.title(r));toast("تم: "+x[0]);load();
    };a.appendChild(b);
   });
   if(s.docs){
    var db=document.createElement("button");db.type="button";db.className="btn";db.textContent="المستمسكات";
    db.onclick=async function(){
     dz.textContent="جاري التحميل...";
     try{var qr=await sb.from("verification_documents").select("doc_type,file_path").eq("company_id",r.id);if(qr.error)throw qr.error;var q=qr.data||[]}catch(e){dz.textContent=errText(e);return}
     dz.textContent="";
     if(!q.length){dz.textContent="لا توجد مستمسكات مرفوعة";return}
     q.forEach(function(x){var l=document.createElement("div");l.className="d";l.textContent=(x.doc_type||"مستمسك")+" — "+x.file_path;dz.appendChild(l)});
    };a.appendChild(db);
   }
   if(s.f){var eb=document.createElement("button");eb.type="button";eb.className="btn";eb.textContent="تعديل";eb.onclick=function(){openForm(s,r)};a.appendChild(eb)}
   var del=document.createElement("button");del.type="button";del.className="btn no";del.textContent="حذف";
   del.onclick=async function(){
    if(!confirm("حذف نهائي: "+s.title(r)+" ؟"))return;
    try{
     if(s.k==="companies"){
      var d1=await sb.from("verification_documents").delete().eq("company_id",r.id);if(d1.error)throw d1.error;
      var d2=await sb.from("devices").update({company_id:null}).eq("company_id",r.id);if(d2.error)throw d2.error;
     }
     var d3=await sb.from(s.k).delete().eq("id",r.id);if(d3.error)throw d3.error;
    }catch(e){toast(errText(e));return}
    await log("حذف",s.k,s.title(r));toast("تم الحذف");load();
   };a.appendChild(del);
   row.appendChild(a);
  }
  list.appendChild(row);
 });
}

function showGate(msg){
 $("app").style.display="none";$("ref").style.display="none";$("out").style.display="none";
 $("gate").style.display="block";$("gm").textContent=msg||"";
}
async function checkAdminAndLoad(){
 var u=await sb.auth.getUser();
 if(!u.data||!u.data.user){showGate("");return}
 var a=await sb.from("admins").select("user_id").eq("user_id",u.data.user.id);
 if(a.error||!a.data||!a.data.length){await sb.auth.signOut();showGate("هذا الحساب ليس مديراً.");return}
 await load();
 $("gate").style.display="none";$("app").style.display="block";$("ref").style.display="inline-block";$("out").style.display="inline-block";
}
async function login(){
 var em=$("em").value.trim(),pw=$("pw").value;
 if(!em||!pw){$("gm").textContent="اكتب الإيميل والرمز.";return}
 $("gm").textContent="جاري الدخول...";
 try{
  var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error)throw r.error;
  await checkAdminAndLoad();
 }catch(e){showGate(errText(e))}
}
async function start(){
 if(typeof supabase==="undefined"){showGate("تعذر تحميل مكتبة الاتصال. تأكد من الإنترنت وحدّث الصفحة.");return}
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 try{await checkAdminAndLoad()}catch(e){showGate(errText(e))}
}
$("retry").onclick=login;
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
$("ref").onclick=function(){load().then(function(){toast("تم التحديث")}).catch(function(e){toast(errText(e))})};
$("out").onclick=async function(){await sb.auth.signOut();showGate("تم تسجيل الخروج.")};
start();
</script>
</body>
</html>
